modLoader = "javafml" #mandatory

loaderVersion = "${loader_version_range}" #mandatory

license = "${mod_license}"

# Fill these in after publishing the repository:
#issueTrackerURL="https://github.com/<you>/SablelMonitor/issues" #optional
#displayURL="https://github.com/<you>/SablelMonitor" #optional

[[mods]] #mandatory

modId = "${mod_id}" #mandatory

version = "${mod_version}" #mandatory

displayName = "${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

credits = "Bundled Rapier natives are a modified build of Sable (PolyForm Shield 1.0.0, (c) RyanHCode and contributors) and Rapier (Apache-2.0, (c) Dimforge and contributors). See META-INF/THIRD-PARTY-NOTICES.md."

logoFile="sablemonitor.png"

authors = "${mod_authors}" #optional

description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sable"
type = "required"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"
reason = "SableMonitor's patched Rapier natives are built from Sable 2.0.6"
