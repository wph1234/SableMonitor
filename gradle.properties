# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# NeoForge
neo_version=21.1.264
neo_version_range=[21,)
loader_version_range=[4,)

# Mod properties
mod_id=sablemonitor
mod_name=Sable Monitor
# The license of this mod's own code. The bundled native library is third-party work with its
# own terms; see THIRD-PARTY-NOTICES.md.
mod_license=MIT
mod_version=0.5.1-alpha-sable2.0.6
mod_group_id=dev.wphuujmhu
mod_authors=wphuujmhu
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A mod that can let you see how many times your sublevel used by /sablemonitor command.

# Dependencies
sable_version=2.0.6
sable_version_range=[2.0.6]
# Each version of sable have a separated rust build

# Used for Simulated, Aeronautics, and Offroad
simulated_version=1.3.0
simulated_version_range=1.3.0